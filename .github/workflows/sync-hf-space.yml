name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "Scheduler-Backend/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Clone Hugging Face Space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it in GitHub repository secrets."
            exit 1
          fi

          SPACE_ID="${HF_SPACE_ID:-PAU-001/CP-SAT_Timetable_Scheduler}"
          if [[ "$SPACE_ID" != */* ]]; then
            SPACE_ID="PAU-001/$SPACE_ID"
          fi

          export SPACE_ID
          ENCODED_SPACE_ID=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SPACE_ID"], safe="/_-"))' )
          AUTH_URL="https://hf-sync:${HF_TOKEN}@huggingface.co/spaces/${ENCODED_SPACE_ID}"

          rm -rf .hf-space
          for attempt in 1 2 3; do
            echo "Clone attempt ${attempt} for Space ${SPACE_ID}"
            if git clone "$AUTH_URL" .hf-space; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to clone Space after 3 attempts."
              echo "Verify HF_TOKEN permissions and HF_SPACE_ID secret if your Space name contains spaces."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Sync backend files to Space root
        run: |
          rsync -av --delete \
            --exclude ".git/" \
            --exclude "output_data/Hybrid-Timetables/*.xlsx" \
            Scheduler-Backend/ .hf-space/

      - name: Commit and push changes
        run: |
          cd .hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure generated binary outputs are never committed to the Space mirror
          git rm -f --cached output_data/Hybrid-Timetables/*.xlsx 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "chore(sync): mirror Scheduler-Backend from GitHub ${GITHUB_SHA}"
          git push origin main
